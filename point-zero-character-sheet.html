<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Точка отсчета — лист персонажа</title>
  <style>
    :root{--bg:#f4f6f5;--card:#fff;--ink:#17333b;--muted:#66777c;--line:#d7e0e1;--teal:#075967;--teal-2:#0f7180;--teal-soft:#e9f3f3;--amber:#ef8b2c;--red:#de3e3e;--shadow:0 12px 36px rgba(18,44,49,.09);--r:12px;--gap:12px;font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--ink)}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);font-size:14px}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid rgba(15,113,128,.22);outline-offset:2px}
    .app{max-width:1500px;margin:auto;padding:12px}.panel,.section{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 1px 2px rgba(16,45,50,.03)}
    .header{display:grid;grid-template-columns:minmax(290px,1fr) auto minmax(150px,1fr);align-items:center;gap:28px;padding:14px 16px;margin-bottom:14px}.identity{display:grid;grid-template-columns:1fr 1fr;gap:12px}.experience{grid-column:1/-1}.logo-wrap{text-align:center;min-width:220px}.logo-wrap img{display:block;width:220px;height:auto;margin:auto}.subtitle{margin-top:6px;color:var(--muted)}.header-actions{justify-self:end;display:grid;grid-template-columns:repeat(2,46px);gap:10px}
    label.field{display:flex;flex-direction:column;gap:5px;color:var(--muted);font-size:12px}.control{width:100%;height:36px;border:1px solid #bdcacc;border-radius:6px;background:#fff;padding:7px 10px;transition:.15s border-color}.control:hover{border-color:#8ca4a8}.control:focus{border-color:var(--teal-2)}textarea.control{height:72px;min-height:54px;resize:vertical;line-height:1.4}.compact{height:32px;padding:5px 8px}.num{text-align:center}
    .icon-btn,.add-btn,.delete-btn,.secondary-btn,.primary-btn{border:1px solid #b9cacc;border-radius:7px;background:#fff;height:38px;display:inline-flex;align-items:center;justify-content:center;gap:7px;color:var(--teal);transition:.15s}.icon-btn{width:40px;padding:0}.icon-btn:hover,.add-btn:hover,.secondary-btn:hover{background:var(--teal-soft);border-color:#8eabad}.icon-btn.active{color:#fff;background:var(--teal);border-color:var(--teal)}.add-btn{padding:0 12px}.delete-btn{height:34px;padding:0 12px;color:var(--red);border-color:#ff7474;margin-left:auto}.delete-btn:hover{background:#fff0f0}.primary-btn{padding:0 18px;color:#fff;background:var(--teal);border-color:var(--teal)}.primary-btn:hover{background:#064b56}.secondary-btn{padding:0 18px}.icon{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .main-grid{display:grid;grid-template-columns:1.02fr .98fr 1.05fr;gap:14px;align-items:start}.column{display:flex;flex-direction:column;gap:14px;min-width:0}.section{padding:12px}.section-head{display:flex;align-items:center;gap:8px;margin-bottom:12px;min-height:38px}.section-head h2{font-size:20px;line-height:1.1;margin:0;margin-right:auto;color:var(--teal)}.module-badge{display:inline-flex;border:1px solid var(--amber);color:#d86a09;background:#fff8ef;border-radius:5px;padding:3px 6px;font-size:11px}.field-labels{color:var(--muted);font-size:11px}.subhead{font-size:15px;margin:-5px 0 10px}
    .attributes-grid{display:grid;grid-template-columns:1fr 52px 52px;gap:10px 10px;align-items:center}.attributes-grid .col-label{text-align:center;color:var(--muted);font-size:11px}.attribute-name{font-weight:650;font-size:16px}
    .tracker{display:grid;gap:8px;width:max-content;max-width:100%}.tracker-row{display:flex;gap:8px;flex-wrap:nowrap}.track-cell{width:20px;height:20px;padding:0;border:1px solid #b7c5c8;border-radius:5px;background:#fff;position:relative}.track-cell.on{border-color:var(--teal-2);background:var(--teal-2)}.track-cell.on:after{content:'✓';position:absolute;inset:0;color:white;font-size:13px;display:grid;place-items:center}.tracker.scroll{overflow-x:auto;padding-bottom:2px}
    .skill-header,.skill-row{display:grid;grid-template-columns:18px minmax(92px,1.3fr) minmax(88px,1fr) 50px 38px;gap:8px;align-items:center}.skill-header{font-size:10px;color:var(--muted);margin-bottom:7px}.skill-row{margin:7px 0}.drag-handle{border:0;background:transparent;color:#72868a;padding:0;cursor:grab;font-size:18px;line-height:1}.drag-handle:active{cursor:grabbing}.skill-row.dragging{opacity:.4}.dice{text-align:center;color:var(--teal);font-weight:700}.skill-delete-slot{grid-column:4/6}.empty-note{padding:18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:8px}
    .cards{display:flex;flex-direction:column;gap:10px}.item-card{border:1px solid var(--line);border-radius:8px;padding:9px;background:#fff}.form-grid{display:grid;gap:9px}.grid-2{grid-template-columns:minmax(0,1fr) 90px}.grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}.card-actions{display:flex;margin-top:8px}.spell-top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px}.check-list{display:flex;flex-direction:column;gap:6px;min-width:102px}.check{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink)}.check input{width:17px;height:17px;accent-color:var(--teal)}
    .bottom-grid{display:grid;grid-template-columns:1fr 2fr;gap:14px;margin-top:14px;padding-top:12px;border-top:1px solid #adc0c3}.general-top{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.general-middle{margin-top:10px}.general-bottom{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.notes textarea{height:164px;min-height:120px}
    .modal-backdrop{position:fixed;inset:0;background:rgba(15,29,32,.35);display:grid;place-items:center;padding:18px;z-index:20}.modal-backdrop[hidden]{display:none}.modal{width:min(720px,100%);background:#fff;border:1px solid #b8c6c8;border-radius:14px;box-shadow:0 28px 70px rgba(0,0,0,.22);overflow:hidden}.modal-head{display:flex;align-items:center;padding:20px 22px;border-bottom:1px solid var(--line)}.modal-head h2{margin:0;font-size:26px;color:var(--ink)}.modal-head .icon-btn{margin-left:auto}.settings-list{display:grid;grid-template-columns:1fr 1fr;gap:12px 28px;padding:22px}.setting-row{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:13px 4px;border-bottom:1px solid #edf1f1;font-size:16px}.switch{width:48px;height:27px;border:1px solid #aababc;border-radius:999px;background:#d9e0e1;padding:2px;display:inline-flex;justify-content:flex-start}.switch:after{content:'';width:21px;height:21px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2)}.switch.on{justify-content:flex-end;background:var(--teal);border-color:var(--teal)}.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:16px 22px;border-top:1px solid var(--line)}
    .toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,12px);background:#17333b;color:#fff;padding:11px 16px;border-radius:8px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.2s;z-index:30}.toast.show{opacity:1;transform:translate(-50%,0)}.toast.error{background:#9e2929}
    @media(max-width:1040px){.header{grid-template-columns:minmax(280px,1fr) auto}.logo-wrap{display:none}.main-grid{grid-template-columns:1fr}.column{display:contents}.section{break-inside:avoid}.bottom-grid{grid-template-columns:1fr}.header-actions{grid-column:2;grid-row:1}.identity{grid-column:1}}
    @media(max-width:620px){.app{padding:6px}.header{grid-template-columns:1fr auto;gap:12px;padding:12px}.identity{grid-template-columns:1fr}.experience{grid-column:1}.header-actions{grid-template-columns:repeat(2,40px)}.section{padding:10px}.section-head{flex-wrap:wrap}.section-head h2{font-size:18px}.add-btn{padding:0 9px}.skill-header{display:none}.skill-row{grid-template-columns:18px 1fr 76px 46px 34px}.grid-4,.grid-3{grid-template-columns:1fr 1fr}.general-top{grid-template-columns:1fr 1fr}.settings-list{grid-template-columns:1fr}.modal-head h2{font-size:21px}.bottom-grid{gap:8px}.track-cell{width:19px;height:19px}.tracker-row{gap:6px}}
  </style>
</head>

      <header class="modal-head"><h2 id="settings-title">Настройка листа</h2><button class="icon-btn" data-modal-action="close" aria-label="Закрыть"><svg class="icon" viewBox="0 0 24 24"><path d="M5 5l14 14M19 5 5 19"/></svg></button></header>
      <div class="settings-list" id="settings-list"></div>
      <footer class="modal-foot"><button class="secondary-btn" data-modal-action="cancel">Отмена</button><button class="primary-btn" data-modal-action="save">Сохранить</button></footer>
    </section>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
  (()=>{
    'use strict';
    const STORAGE_KEY='point-zero-character-sheet-v1';
    const ICONS={
      plus:'<svg class="icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
      gear:'<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1l2-1.5-2-3.4-2.4 1A7 7 0 0 0 15 6l-.3-2.6h-4L10.4 6a7 7 0 0 0-1.5.9l-2.4-1-2 3.4 2 1.5a7 7 0 0 0 0 2.2l-2 1.5 2 3.4 2.4-1a7 7 0 0 0 1.5.9l.3 2.6h4l.3-2.6a7 7 0 0 0 1.5-.9l2.4 1 2-3.4-2-1.5c.1-.3.1-.7.1-1z"/></svg>',
      trash:'<svg class="icon" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3m3 0-1 13H7L6 7m4 4v5m4-5v5"/></svg>'
    };
    const ATTRIBUTE_OPTIONS=[['strength','Сила'],['agility','Ловкость'],['mind','Разум'],['empathy','Эмпатия']];
    const STANDARD_SKILLS=[
      ['athletics','Атлетика','strength'],['melee','Ближний бой','strength'],['endurance','Выносливость','strength'],
      ['stealth','Скрытность','agility'],['sleightOfHand','Ловкость рук','agility'],['shooting','Стрельба','agility'],
      ['medicine','Медицина','mind'],['survival','Выживание','mind'],['investigation','Расследование','mind'],
      ['insight','Проницательность','empathy'],['performance','Выступление','empathy'],['influence','Влияние','empathy']
    ];
    const MODULES=[['stress','Уровень стресса'],['infection','Заражение'],['radiation','Радиация'],['will','Воля'],['magic','Магия']];
    const clone=o=>JSON.parse(JSON.stringify(o));
    const blank=(id,fields)=>Object.assign({id},Object.fromEntries(fields.map(x=>[x,''])));
    function defaults(){return{
      header:{name:'',role:'',experience:0},
      attributes:{strength:{max:0,current:0},agility:{max:0,current:0},mind:{max:0,current:0},empathy:{max:0,current:0}},
      trackers:{willpower:0,health:0,infection:0,radiation:0,stress:0},
      modules:{magic:true,will:true,radiation:false,infection:true,stress:false},
      skills:STANDARD_SKILLS.map(([id,name,attribute])=>({id,name,attribute,level:0,standard:true})),
      weapons:[blank('weapon_1',['name','damage','bonus','range','durability','description']),blank('weapon_2',['name','damage','bonus','range','durability','description'])],
      armor:[blank('armor_1',['name','protection','description','penalty']),blank('armor_2',['name','protection','description','penalty'])],
      talents:[blank('talent_1',['name','level','description']),blank('talent_2',['name','level','description'])],
      equipment:[blank('equipment_1',['name','bonus','description']),blank('equipment_2',['name','bonus','description'])],
      spells:[Object.assign(blank('spell_1',['name','rank','duration','range','ingredients','description']),{ritual:false,wordOfPower:false,willCost:false})],
      general:{age:0,sex:'',race:'',accessLevel:'',appearance:'',personality:'',goals:''},notes:{text:''},
      editModes:{skills:false,weapons:false,armor:false,talents:false,equipment:false,spells:false},
      counters:{customSkill:0,weapon:2,armor:2,talent:2,equipment:2,spell:1},ui:{textareaHeights:{}}
    }}
    let state=defaults(),draftModules=null,dragIndex=null,toastTimer=null;
    const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const pathGet=(obj,path)=>path.split('.').reduce((o,k)=>o?.[k],obj);
    const pathSet=(obj,path,value)=>{const keys=path.split('.');const last=keys.pop();const target=keys.reduce((o,k)=>o[k],obj);target[last]=value};
    const options=(selected)=>ATTRIBUTE_OPTIONS.map(([v,t])=>`<option value="${v}" ${v===selected?'selected':''}>${t}</option>`).join('');
    const field=(label,path,value,attrs='')=>`<label class="field">${label}<input class="control compact" data-path="${path}" value="${esc(value)}" ${attrs}></label>`;
    const area=(label,path,value,key)=>`<label class="field">${label}<textarea class="control" data-path="${path}" data-height-key="${key}" style="height:${state.ui.textareaHeights[key]||72}px">${esc(value)}</textarea></label>`;
    const sectionHead=(title,section,{module=false,add=false,settings=false}={})=>`<div class="section-head"><h2>${title}</h2>${module?'<span class="module-badge">Модуль</span>':''}${add?`<button class="add-btn" data-action="add" data-section="${section}">${ICONS.plus}Добавить</button>`:''}${settings?`<button class="icon-btn ${state.editModes[section]?'active':''}" data-action="edit-mode" data-section="${section}" aria-label="Настройка раздела ${title}" title="Настройка раздела">${ICONS.gear}</button>`:''}</div>`;
    function tracker(name,total,rows=1){const per=Math.ceil(total/rows),value=Number(state.trackers[name]??(name==='experience'?state.header.experience:0));let html='<div class="tracker scroll">';for(let r=0;r<rows;r++){html+='<div class="tracker-row">';for(let c=0;c<per;c++){const i=r*per+c;if(i>=total)break;html+=`<button type="button" class="track-cell ${i<value?'on':''}" data-tracker="${name}" data-index="${i}" role="checkbox" aria-checked="${i<value}" aria-label="Ячейка ${i+1} из ${total}"></button>`}html+='</div>'}return html+'</div>'}
    function attributesSection(){return `<section class="section">${sectionHead('Характеристики','attributes')}<div class="attributes-grid"><span></span><span class="col-label">Макс.</span><span class="col-label">Тек.</span>${ATTRIBUTE_OPTIONS.map(([id,label])=>`<span class="attribute-name">${label}</span><input class="control compact num" inputmode="numeric" data-path="attributes.${id}.max" data-kind="attribute-max" data-attribute="${id}" value="${esc(state.attributes[id].max)}" min="0" max="5"><input class="control compact num" inputmode="numeric" data-path="attributes.${id}.current" data-kind="attribute-current" data-attribute="${id}" value="${esc(state.attributes[id].current)}" min="0" max="5">`).join('')}</div></section>`}
    function skillsSection(){return `<section class="section skills-section">${sectionHead('Навыки','skills',{add:true,settings:true})}<div class="skill-header"><span></span><span>Навык</span><span>Характеристика</span><span>Уровень</span><span>Кубы</span></div><div id="skill-rows">${state.skills.map(skillRow).join('')}</div></section>`}
    function skillRow(skill,i){const editing=state.editModes.skills&&!skill.standard;const dice=Number(state.attributes[skill.attribute]?.current||0)+Number(skill.level||0);return `<div class="skill-row" data-skill-index="${i}" draggable="false"><button class="drag-handle" type="button" title="Перетащить" aria-label="Перетащить навык">⠿</button><input class="control compact" maxlength="40" data-path="skills.${i}.name" value="${esc(skill.name)}" aria-label="Название навыка"><select class="control compact" data-path="skills.${i}.attribute" data-recalc="skills" aria-label="Характеристика">${options(skill.attribute)}</select>${editing?`<div class="skill-delete-slot"><button class="delete-btn" data-action="delete-skill" data-index="${i}">${ICONS.trash}Удалить</button></div>`:`<input class="control compact num" inputmode="numeric" data-path="skills.${i}.level" data-kind="bounded" data-min="0" data-max="99" value="${esc(skill.level)}" aria-label="Уровень"><output class="dice" data-dice-index="${i}">${dice}</output>`}</div>`}
    function moduleTracker(title,name,total,rows){return `<section class="section">${sectionHead(title,name,{module:true})}${tracker(name,total,rows)}</section>`}
    function combatSection(){return `<section class="section">${sectionHead('Боевые параметры','combat')}<div class="subhead">Здоровье</div>${tracker('health',11,1)}</section>`}
    const deleteButton=(section,i)=>state.editModes[section]?`<div class="card-actions"><button class="delete-btn" data-action="delete-card" data-section="${section}" data-index="${i}">${ICONS.trash}Удалить</button></div>`:'';
    function cardsSection(title,section,cards,renderCard,module=false){return `<section class="section">${sectionHead(title,section,{module,add:true,settings:true})}<div class="cards">${cards.length?cards.map((c,i)=>renderCard(c,i)).join(''):'<div class="empty-note">Карточек пока нет</div>'}</div></section>`}
    function weaponCard(c,i){const b=`weapons.${i}`;return `<article class="item-card"><div class="form-grid">${field('Название',`${b}.name`,c.name,'maxlength="200"')}<div class="form-grid grid-4">${field('Урон',`${b}.damage`,c.damage,'maxlength="7"')}${field('Бонус',`${b}.bonus`,c.bonus,'maxlength="3" data-kind="signed" inputmode="numeric"')}${field('Дистанция',`${b}.range`,c.range,'maxlength="7" data-kind="range" inputmode="numeric"')}${field('Прочность',`${b}.durability`,c.durability,'maxlength="3" data-kind="digits" inputmode="numeric"')}</div>${area('Описание',`${b}.description`,c.description,`weapons.${c.id}.description`)}</div>${deleteButton('weapons',i)}</article>`}
    function armorCard(c,i){const b=`armor.${i}`;return `<article class="item-card"><div class="form-grid"><div class="form-grid grid-2">${field('Название',`${b}.name`,c.name,'maxlength="200"')}${field('Уровень защиты',`${b}.protection`,c.protection,'maxlength="7"')}</div><div class="form-grid grid-2">${area('Описание',`${b}.description`,c.description,`armor.${c.id}.description`)}${field('Штраф',`${b}.penalty`,c.penalty,'maxlength="3" data-kind="signed" inputmode="numeric"')}</div></div>${deleteButton('armor',i)}</article>`}
    function talentCard(c,i){const b=`talents.${i}`;return `<article class="item-card"><div class="form-grid"><div class="form-grid grid-2">${field('Название',`${b}.name`,c.name,'maxlength="80"')}${field('Уровень',`${b}.level`,c.level,'maxlength="2" data-kind="digits" inputmode="numeric"')}</div>${area('Описание',`${b}.description`,c.description,`talents.${c.id}.description`)}</div>${deleteButton('talents',i)}</article>`}
    function equipmentCard(c,i){const b=`equipment.${i}`;return `<article class="item-card"><div class="form-grid"><div class="form-grid grid-2">${field('Название',`${b}.name`,c.name,'maxlength="80"')}${field('Бонус',`${b}.bonus`,c.bonus,'maxlength="5"')}</div>${area('Описание',`${b}.description`,c.description,`equipment.${c.id}.description`)}</div>${deleteButton('equipment',i)}</article>`}
    function spellCard(c,i){const b=`spells.${i}`;return `<article class="item-card"><div class="form-grid"><div class="spell-top">${field('Название',`${b}.name`,c.name,'maxlength="80"')}<div class="check-list"><label class="check"><input type="checkbox" data-path="${b}.ritual" ${c.ritual?'checked':''}>Ритуал</label><label class="check"><input type="checkbox" data-path="${b}.wordOfPower" ${c.wordOfPower?'checked':''}>Слово силы</label><label class="check"><input type="checkbox" data-path="${b}.willCost" ${c.willCost?'checked':''}>Затраты воли</label></div></div><div class="form-grid grid-3">${field('Ранг',`${b}.rank`,c.rank,'maxlength="3" data-kind="digits" inputmode="numeric"')}${field('Длительность',`${b}.duration`,c.duration,'maxlength="8"')}${field('Дистанция',`${b}.range`,c.range,'maxlength="7" data-kind="range" inputmode="numeric"')}</div>${field('Ингредиенты',`${b}.ingredients`,c.ingredients,'maxlength="80"')}${area('Описание',`${b}.description`,c.description,`spells.${c.id}.description`)}</div>${deleteButton('spells',i)}</article>`}
    function generalSection(){const g=state.general;return `<section class="section">${sectionHead('Общая информация','general')}<div class="general-top">${field('Возраст','general.age',g.age,'data-kind="bounded" data-min="0" data-max="100000" inputmode="numeric"')}<label class="field">Пол<select class="control compact" data-path="general.sex"><option value="" ${!g.sex?'selected':''}>Не указан</option><option ${g.sex==='Мужской'?'selected':''}>Мужской</option><option ${g.sex==='Женский'?'selected':''}>Женский</option><option ${g.sex==='Другой'?'selected':''}>Другой</option></select></label>${field('Раса','general.race',g.race,'maxlength="15"')}${field('Уровень допуска','general.accessLevel',g.accessLevel,'maxlength="4"')}</div><div class="general-middle">${area('Внешний вид','general.appearance',g.appearance,'general.appearance')}</div><div class="general-bottom">${area('Особенности характера','general.personality',g.personality,'general.personality')}${area('Цели','general.goals',g.goals,'general.goals')}</div></section>`}
    function notesSection(){return `<section class="section notes">${sectionHead('Заметки','notes')}${area('','notes.text',state.notes.text,'notes.text')}</section>`}
    function render(){
      document.querySelector('[data-path="header.name"]').value=state.header.name;document.querySelector('[data-path="header.role"]').value=state.header.role;
      document.getElementById('experience-tracker').innerHTML=tracker('experience',12,1);
      const col1=`<div class="column">${attributesSection()}${skillsSection()}</div>`;
      const col2=`<div class="column">${state.modules.will?moduleTracker('Сила воли','willpower',22,2):''}${combatSection()}${cardsSection('Оружие','weapons',state.weapons,weaponCard)}${cardsSection('Броня','armor',state.armor,armorCard)}</div>`;
      const col3=`<div class="column">${cardsSection('Таланты','talents',state.talents,talentCard)}${cardsSection('Снаряжение','equipment',state.equipment,equipmentCard)}${state.modules.magic?cardsSection('Заклинания','spells',state.spells,spellCard,true):''}${state.modules.infection?moduleTracker('Заражение','infection',24,2):''}${state.modules.radiation?moduleTracker('Радиация','radiation',24,2):''}${state.modules.stress?moduleTracker('Уровень стресса','stress',24,2):''}</div>`;
      document.getElementById('main-grid').innerHTML=col1+col2+col3;document.getElementById('bottom-grid').innerHTML=generalSection()+notesSection();
    }
    function sanitizeInput(el){let v=el.value;const kind=el.dataset.kind;if(kind==='digits')v=v.replace(/\D/g,'');if(kind==='signed'){v=v.replace(/[^\d-]/g,'');v=(v.startsWith('-')?'-':'')+v.replace(/-/g,'')}if(kind==='range')v=v.replace(/[^\d/\\]/g,'');if(kind==='bounded'||kind==='attribute-max'||kind==='attribute-current'){if(v==='')return '';v=String(Math.min(Number(el.dataset.max||5),Math.max(Number(el.dataset.min||0),parseInt(v,10)||0)))}el.value=v;return v}
    function updateDice(){document.querySelectorAll('[data-dice-index]').forEach(o=>{const s=state.skills[Number(o.dataset.diceIndex)];o.value=o.textContent=Number(state.attributes[s.attribute]?.current||0)+Number(s.level||0)})}
    function captureHeights(){document.querySelectorAll('textarea[data-height-key]').forEach(t=>state.ui.textareaHeights[t.dataset.heightKey]=Math.round(t.getBoundingClientRect().height))}
    function showToast(message,error=false,duration=2200){const t=document.getElementById('toast');clearTimeout(toastTimer);t.textContent=message;t.className='toast show'+(error?' error':'');toastTimer=setTimeout(()=>t.className='toast',duration)}
    function saveLocal(silent=false){captureHeights();localStorage.setItem(STORAGE_KEY,JSON.stringify({schema:'point-zero-character-sheet',version:1,state}));if(!silent)showToast('Лист сохранён')}
    function exported(){captureHeights();return{schema:'point-zero-character-sheet',version:1,state:clone(state)}}
    function objectHas(o,keys){return o&&typeof o==='object'&&keys.every(k=>Object.prototype.hasOwnProperty.call(o,k))}
    function validPayload(p){if(!objectHas(p,['schema','version','state'])||p.schema!=='point-zero-character-sheet'||p.version!==1)return false;const s=p.state;if(!objectHas(s,['header','attributes','trackers','modules','skills','weapons','armor','talents','equipment','spells','general','notes','editModes','counters','ui']))return false;if(!objectHas(s.header,['name','role','experience'])||!objectHas(s.attributes,['strength','agility','mind','empathy'])||!objectHas(s.modules,['magic','will','radiation','infection','stress']))return false;if(!Array.isArray(s.skills)||!['weapons','armor','talents','equipment','spells'].every(k=>Array.isArray(s[k])))return false;return s.skills.every(x=>objectHas(x,['id','name','attribute','level','standard']))&&s.weapons.every(x=>objectHas(x,['id','name','damage','bonus','range','durability','description']))&&s.armor.every(x=>objectHas(x,['id','name','protection','description','penalty']))&&s.talents.every(x=>objectHas(x,['id','name','level','description']))&&s.equipment.every(x=>objectHas(x,['id','name','bonus','description']))&&s.spells.every(x=>objectHas(x,['id','name','rank','duration','range','ingredients','description','ritual','wordOfPower','willCost']))}
    function openSettings(){draftModules=clone(state.modules);renderSettings();const m=document.getElementById('settings-modal');m.hidden=false;m.setAttribute('aria-hidden','false');m.querySelector('[data-modal-action="close"]').focus()}
    function closeSettings(){const m=document.getElementById('settings-modal');m.hidden=true;m.setAttribute('aria-hidden','true');draftModules=null;document.getElementById('settings-btn').focus()}
    function renderSettings(){document.getElementById('settings-list').innerHTML=MODULES.map(([id,label])=>`<div class="setting-row"><span>${label}</span><button type="button" class="switch ${draftModules[id]?'on':''}" data-module="${id}" role="switch" aria-checked="${draftModules[id]}" aria-label="${label}"></button></div>`).join('')}
    function addCard(section){const map={weapons:['weapon',['name','damage','bonus','range','durability','description']],armor:['armor',['name','protection','description','penalty']],talents:['talent',['name','level','description']],equipment:['equipment',['name','bonus','description']],spells:['spell',['name','rank','duration','range','ingredients','description']]};const [counter,fields]=map[section];state.counters[counter]++;const item=blank(`${counter}_${state.counters[counter]}`,fields);if(section==='spells')Object.assign(item,{ritual:false,wordOfPower:false,willCost:false});state[section].push(item);render()}
    function handleAction(btn){const action=btn.dataset.action,section=btn.dataset.section;if(action==='add'){if(section==='skills'){state.counters.customSkill++;state.skills.push({id:`addskill_${state.counters.customSkill}`,name:'',attribute:'strength',level:0,standard:false});render()}else addCard(section)}if(action==='edit-mode'){state.editModes[section]=!state.editModes[section];render()}if(action==='delete-card'){state[section].splice(Number(btn.dataset.index),1);render()}if(action==='delete-skill'){state.skills.splice(Number(btn.dataset.index),1);render()}}
    document.addEventListener('input',e=>{const el=e.target;if(!el.dataset.path)return;let v=el.type==='checkbox'?el.checked:sanitizeInput(el);pathSet(state,el.dataset.path,v);if(el.dataset.kind==='attribute-max'){const id=el.dataset.attribute,max=Number(v||0);if(Number(state.attributes[id].current||0)>max)state.attributes[id].current=max;render()}else if(el.dataset.kind==='attribute-current'||el.dataset.recalc==='skills'||/skills\.\d+\.level/.test(el.dataset.path))updateDice()});
    document.addEventListener('change',e=>{const el=e.target;if(el.matches('textarea[data-height-key]'))state.ui.textareaHeights[el.dataset.heightKey]=Math.round(el.getBoundingClientRect().height)});
    document.addEventListener('mouseup',e=>{const el=e.target;if(el.matches('textarea[data-height-key]'))setTimeout(()=>state.ui.textareaHeights[el.dataset.heightKey]=Math.round(el.getBoundingClientRect().height),0)});
    document.addEventListener('click',e=>{const trackerCell=e.target.closest('[data-tracker]');if(trackerCell){const name=trackerCell.dataset.tracker,i=Number(trackerCell.dataset.index),key=name==='experience'?state.header:state.trackers,prop=name==='experience'?'experience':name,current=Number(key[prop]||0),clicked=i+1;key[prop]=clicked===current?Math.max(0,current-1):clicked;render();return}const action=e.target.closest('[data-action]');if(action){handleAction(action);return}const module=e.target.closest('[data-module]');if(module){draftModules[module.dataset.module]=!draftModules[module.dataset.module];renderSettings();return}const modalAction=e.target.closest('[data-modal-action]')?.dataset.modalAction;if(modalAction==='close'||modalAction==='cancel')closeSettings();if(modalAction==='save'){state.modules=clone(draftModules);closeSettings();render()}});
    document.addEventListener('pointerdown',e=>{const h=e.target.closest('.drag-handle');if(h)h.closest('.skill-row').draggable=true});
    document.addEventListener('dragstart',e=>{const row=e.target.closest('.skill-row');if(!row)return;dragIndex=Number(row.dataset.skillIndex);row.classList.add('dragging');e.dataTransfer.effectAllowed='move'});
    document.addEventListener('dragover',e=>{if(e.target.closest('.skill-row'))e.preventDefault()});
    document.addEventListener('drop',e=>{const row=e.target.closest('.skill-row');if(!row||dragIndex===null)return;e.preventDefault();const to=Number(row.dataset.skillIndex),item=state.skills.splice(dragIndex,1)[0];state.skills.splice(to,0,item);dragIndex=null;render()});
    document.addEventListener('dragend',e=>{const row=e.target.closest('.skill-row');if(row){row.draggable=false;row.classList.remove('dragging')}dragIndex=null});
    document.getElementById('save-btn').addEventListener('click',()=>saveLocal());
    document.getElementById('settings-btn').addEventListener('click',openSettings);
    document.getElementById('export-btn').addEventListener('click',()=>{const data=JSON.stringify(exported(),null,2),blob=new Blob([data],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`point-zero-${(state.header.name||'character').trim().replace(/[^a-zа-яё0-9_-]+/gi,'-')}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});
    document.getElementById('import-btn').addEventListener('click',()=>document.getElementById('import-file').click());
    document.getElementById('import-file').addEventListener('change',async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;try{const payload=JSON.parse(await file.text());if(!validPayload(payload))throw new Error('shape');state=clone(payload.state);saveLocal(true);render();showToast('Персонаж загружен')}catch{showToast('Неверный файл сохранения',true,3000)}});
    document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!document.getElementById('settings-modal').hidden)closeSettings()});
    try{const cached=JSON.parse(localStorage.getItem(STORAGE_KEY));if(validPayload(cached))state=clone(cached.state)}catch{}
    render();
  })();
  </script>
</body>
</html>
